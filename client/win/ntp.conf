# Disable drift tracking to prevent historical smoothing from polluting a short run
driftfile "C:\Program Files (x86)\NTP\etc\ntp.drift"

# =====================================================================
# HIGH-JITTER ALGORITHM PARAMETERS
# =====================================================================
# minpoll/maxpoll 3 forces a packet burst every 8 seconds (high-density sampling)
# true: marks this server as a truechimer, forcing NTP to trust its geometry over network noise
server 192.168.1.100 iburst burst minpoll 3 maxpoll 3 true prefer

# =====================================================================
# KERNEL TINKER FILTERING
# =====================================================================
# step 0.001: Instantly jump (step) the clock if off by >1ms. Zero gradual slewing.
# panic 0: Disables safety aborts for large time gaps.
# dispersion 1: Drops accepted dispersion error to prioritize tightly grouped packets.
tinker step 0.001 panic 0 dispersion 1

# =====================================================================
# DISCARD NOISY OUTLIERS
# =====================================================================
# Discard any packet that experiences a round-trip delay variance worse than 50ms
tos maxdist 0.05
