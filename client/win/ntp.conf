# C:\Program Files (x86)\NTP\etc\ntp.conf

# Disable continuous tracking files since we terminate traffic
driftfile "C:\Program Files (x86)\NTP\etc\ntp.drift"

# Target your remote time servers with high-frequency initial bursts
server 192.168.1.100 iburst burst prefer

# Tinker command to force rapid clock stepping instead of slow slewing
tinker step 0.05 panic 0