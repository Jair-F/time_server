# Point to your server IP, set it offline initially, and optimize for jitter
server 192.168.1.100 offline minpoll 2 maxpoll 2 maxsamples 16 maxdelay 0.1

# Allow the clock to step instantly if it is off by more than 0.01 seconds
makestep 0.01 -1

# Dump history files so calculations don't carry over between sessions
dumpdir /var/lib/chrony
