# /etc/chrony/chrony.conf

# Point to Stratum 1 GPS Server
# - iburst: Rapid 8-packet burst on startup/reconnect for instant initial offset calculation
# - minpoll 0 maxpoll 2: Polls every 1 to 4 seconds (ideal for a short 15-min window)
# - maxsamples 16: Keeps a rolling filter of 16 measurements for noise reduction
# - maxdelay 0.1: Rejects packets with network latency > 100ms
# - xleave: Enables interleaved mode to cut out client-side kernel queuing delay
server 192.168.1.100 iburst minpoll 0 maxpoll 2 maxsamples 16 maxdelay 0.1 xleave

# Allow the clock to step instantly at ANY time if off by > 1ms (0.001s)
makestep 0.001 -1

# Directory to dump measurement history when shutting down/disconnecting
dumpdir /var/lib/chrony

# Location for saving clock frequency drift between boots
driftfile /var/lib/chrony/drift