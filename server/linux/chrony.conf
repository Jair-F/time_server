# /etc/chrony/chrony.conf

# ==========================================
# 1. TIME SOURCE (GPS REFCLOCK CONFIGURATION)
# ==========================================
# Adjust based on your GPS driver (SHM, SOCK, or PHC). 
# Example uses standard GPSD Shared Memory (SHM 0) and high-accuracy PPS (SHM 1)
refclock SHM 0 poll 0 refid GPS delay 0.100
refclock SHM 1 poll 0 refid PPS lock GPS precision -20

# Remove the fallback 'local stratum 10' because your GPS makes this server a Stratum 1 Master.
# If your GPS receiver drops completely, this fallback ensures clients aren't rejected.
local stratum 1

# ==========================================
# 2. CLIENT ACCESS & UNLIMITED BURSTING
# ==========================================
# Allow your specific client to request time
allow 192.168.1.50

# REMOVE CLIENT RATE LIMITS (CRITICAL): Disables the default defense mechanism 
# that blocks clients sending high-density/burst packets over high-jitter lines.
ratelimit interval -10 burst 9999 leak 9999

# EXPAND LOG MEMORY: Prevents Chrony from dropping high-frequency client histories
clientloglimit 10485760

# ==========================================
# 3. MAXIMUM PRECISION EXTRA DIRECTIVES
# ==========================================
# Enable Network Interleaved Mode to bypass OS kernel queuing delays on UDP packets
# (Ensure clients also add 'xleave' to their server lines)
allowmon

# Enable Hardware Timestamping if your Network Interface Card (NIC) supports it
# Replace 'eth0' with your actual network interface name (check via `ip a`)
hwtimestamp eth0

# Store clock frequency drift
driftfile /var/lib/chrony/drift
