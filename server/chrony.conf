# ==========================================
# 1. TIME SOURCE (GPS REFCLOCK CONFIGURATION)
# ==========================================
refclock SHM 0 poll 0 refid GPS delay 0.100 trust
refclock SHM 1 poll 0 refid PPS lock GPS precision -20 trust

# Stratum 1 Master mode
local stratum 1

# ==========================================
# 2. CLIENT ACCESS & UNLIMITED BURSTING
# ==========================================
allow all
ratelimit interval -10 burst 9999 leak 9999
clientloglimit 10485760

# ==========================================
# 3. MAXIMUM PRECISION EXTRA DIRECTIVES
# ==========================================
#hwtimestamp eth0
driftfile /var/lib/chrony/drift

###NTP_SERVERS###

